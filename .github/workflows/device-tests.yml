name: Device tests

# 在 Android / iOS 模拟器上运行 integration_test（#32，architecture §5.4「设备与模拟器上的集成测试」）。
# 较慢（每个任务约 15–30 分钟），只在推送 main 与手动触发时运行，不在 PR 上运行，也不设为必须通过的检查。
#
# 模拟器读不到仓库里的 test/fixtures/：mock 服务器在 runner 上以 --test-control 启动，
# 测试经 TSUMUGI_MOCK_SERVER 连接它（Android 用 adb reverse，由 run_device_tests.sh 在每个文件前建立；
# iOS 模拟器与 runner 共用网络）。
#
# 首次构建很慢，算进第一个测试文件会超过 FILE_TIMEOUT 而被结束重试：
# Android 测试前先 `flutter build apk --debug`（装 NDK / CMake、冷 Gradle 构建，之后测试只需增量构建）；
# iOS 上预构建（`flutter build ios --simulator`）的产物测试构建用不上，改为给第一个文件 FIRST_FILE_TIMEOUT
# （SPM 拉取、pod install、全量 Xcode 构建合计约 10 分钟）。
#
# 第三方 Action 固定到提交（注释为对应版本）。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"
  MOCK_PORT: "8081"
  # 每个测试文件的时限（秒），超时或基础设施错误时重试一次，见 tool/ci/run_device_tests.sh。
  FILE_TIMEOUT: "600"
  FIRST_FILE_TIMEOUT: "1200"
  TESTS: integration_test/app_flow_test.dart integration_test/script_stack_depth_test.dart integration_test/download_offline_test.dart integration_test/video_download_offline_test.dart integration_test/sync_test.dart

jobs:
  android:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - name: Warm up build
        run: flutter build apk --debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start mock server
        run: tool/ci/start_mock_server.sh
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: tool/ci/run_device_tests.sh emulator-5554 ${{ env.TESTS }}
      # 重试后通过的基础设施错误也留下诊断信息，便于定位，所以不只在失败时上传。
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator-logs
          path: |
            mock_server.log
            build/device_logs/
          retention-days: 7

  ios:
    name: iOS simulator
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - name: Start mock server
        run: tool/ci/start_mock_server.sh
      - name: Boot simulator
        id: sim
        run: |
          # 取最新 iOS 运行时中的第一台 iPhone。
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if ".iOS-" in k),
                       key=lambda k: [int(x) for x in k.rsplit(".iOS-", 1)[1].split("-")])
          print(next(d["udid"] for d in devices[ios[-1]] if d["name"].startswith("iPhone")))
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl list devices booted
      - name: Run integration tests
        run: tool/ci/run_device_tests.sh ${{ steps.sim.outputs.udid }} ${{ env.TESTS }}
      # 重试后通过的基础设施错误也留下诊断信息，便于定位，所以不只在失败时上传。
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-logs
          path: |
            mock_server.log
            build/device_logs/
          retention-days: 7
