name: tsumugi
description: "Cross-platform open-source media aggregator (comic, novel, video, music) driven by third-party source rules."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.7.0
  cookie_jar: ^4.0.9
  crypto: ^3.0.8
  dio: ^5.11.1
  dio_cookie_manager: ^3.5.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_inappwebview: 6.2.0-beta.3
  flutter_riverpod: ^3.5.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  html: ^0.15.7
  json_annotation: ^4.12.0
  json_path: 0.9.0
  media_kit: 1.2.6
  media_kit_libs_android_video: 1.3.8
  media_kit_libs_ios_video: 1.1.4
  media_kit_libs_windows_video: 1.0.11
  media_kit_video: 2.0.1
  path_provider: ^2.1.6
  pointycastle: ^4.0.0
  # 固定版本：native_stack.dart 依赖 qjs 内部的 JSRuntime.ptr 布局，升级前须复查（#28）。
  qjs: 0.2.3
  riverpod_annotation: ^4.0.8
  xml: 7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  riverpod_generator: ^4.0.10
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  drift_dev: ^2.35.3
  fake_async: ^1.3.3
  integration_test:
    sdk: flutter

dependency_overrides:
  # media_kit_video 2.0.1 + 一处补丁（#39，architecture §6.4.2）：Android 视频输出就绪时，
  # 位置仍为 0 或已播完则不 seek。fork 在维护者账号下，只改 widListener；
  # 上游发布包含修复的版本后删除这里，回到 pub.dev 的正式版本。
  media_kit_video:
    git:
      url: https://github.com/Shiroha23/media-kit.git
      ref: c644ac662d013dc2435c3b999f6f9189f5499f07
      path: media_kit_video

flutter:
  uses-material-design: true
