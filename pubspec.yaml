name: tsumugi
description: "Cross-platform open-source media aggregator (comic, novel, video, music) driven by third-party source rules."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.7.0
  cookie_jar: ^4.0.9
  crypto: ^3.0.8
  dio: ^5.11.1
  dio_cookie_manager: ^3.5.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_inappwebview: 6.2.0-beta.3
  flutter_riverpod: ^3.5.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  html: ^0.15.7
  json_annotation: ^4.12.0
  json_path: 0.9.0
  path_provider: ^2.1.6
  pointycastle: ^4.0.0
  qjs: ^0.2.3
  riverpod_annotation: ^4.0.8
  xml: 7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  riverpod_generator: ^4.0.10
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  drift_dev: ^2.35.3
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
